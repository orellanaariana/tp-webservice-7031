<div class="container mt-5">
  <h2 class="text-center mb-4">Portal de Películas - Top 100 IMDB</h2>
  
  <div class="row">
    @for (pelicula of peliculas; track pelicula.title) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img [src]="pelicula.image" class="card-img-top" alt="Portada de {{ pelicula.title }}">
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ pelicula.title }} ({{ pelicula.year }})</h5>
            <p class="card-text flex-grow-1">{{ pelicula.description }}</p>
            <div class="mt-auto">
              <span class="badge bg-primary">{{ pelicula.genre }}</span>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center mt-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando películas o no se encontraron resultados...</p>
      </div>
    }
  </div>
</div>
